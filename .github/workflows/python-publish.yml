name: Upload Python Package

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # environment: release  # Uncomment if you want to use GitHub Environments

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for versioneer to find tags

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'  # Using 3.9 natively for Strict Version build

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        # Build Strict Version
        # No extra flags needed because we are running on Python 3.9
        python -m build

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
