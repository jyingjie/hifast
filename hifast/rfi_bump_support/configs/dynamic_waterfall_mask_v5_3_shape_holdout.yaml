# v5.3 形状条件保留测试。定位参数与冻结的 v5.2 完全相同。

metadata:
  version: hierarchical_track_shape_gate_v5_3
  status: frozen_before_shape_holdout
  formal_science_mask: false

waterfall:
  frequency_range_mhz: [1421.0, 1424.8]
  time_bin_seconds: [15.0, 30.0]
  baseline_width_mhz: 0.55
  smooth_fwhm_mhz: 0.07

stage_configs:
  primary: dynamic_waterfall_mask_v5_1.yaml
  expanded: dynamic_waterfall_mask_v5_2_expanded.yaml
  edge: dynamic_waterfall_mask_v5_2_edge.yaml

stages:
  primary:
    trigger: always
    maximum_candidate_match_khz: 50.0
    maximum_spacing_standard_deviation_mhz: 0.075
    minimum_matched_guides: 3
    minimum_track_agreement_fraction: 0.80
    minimum_track_correlation: null
  expanded:
    trigger: primary_failed
    maximum_candidate_match_khz: 100.0
    maximum_spacing_standard_deviation_mhz: 0.12
    minimum_matched_guides: 3
    minimum_track_agreement_fraction: 0.80
    minimum_track_correlation: 0.70
  edge:
    trigger: expanded_failed_with_edge_evidence
    maximum_candidate_match_khz: 100.0
    maximum_spacing_standard_deviation_mhz: 0.12
    minimum_matched_guides: 4
    minimum_track_agreement_fraction: 0.90
    minimum_track_correlation: 0.95
    minimum_teeth_above_strict_snr: 3
    strict_amplitude_snr: 3.0

edge_trigger:
  required_tooth_count: 4
  minimum_dynamic_path_z: 2.5
  minimum_profile_strength: 0.25
  minimum_search_edge_fraction_exclusive: 0.10
  require_evidence_in_both_time_bins: true

mask:
  minimum_amplitude_snr: 0.5
  maximum_fwhm_khz: 120.0
  minimum_masked_tooth_count: 3
  half_width_fwhm_grid:
    [0.50, 0.55, 0.60, 0.65, 0.675, 0.70, 0.705, 0.71, 0.715,
     0.725, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00, 1.10, 1.20]
  margin_channels: 0.50

acceptance:
  maximum_total_leakage_fraction_for_width_selection: 0.08
  maximum_total_leakage_fraction_for_final_acceptance: 0.10
  maximum_single_tooth_leakage_fraction: 0.15
  maximum_test_band_mask_fraction: 0.15
  require_all_selected_tooth_metrics_finite: true

shape_holdout:
  scans: [5, 63]
  dates: ["20240206", "20230929"]
  beams: [M04, M05, M07, M12, M18]
  polarizations: [XX, YY]
  sample_count: 20

restrictions:
  modify_input_hdf5: false
  write_formal_mask: false
  run_doppler_correction: false
  generate_cube: false
